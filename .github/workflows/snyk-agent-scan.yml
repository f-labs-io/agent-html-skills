name: snyk-agent-scan

# Runs Snyk Agent Scan — the engine behind the skills.sh security badges — over the
# plugin's skills and fails on any finding that isn't on the accepted list in
# scripts/snyk-gate.py. plugins/html-skills/SECURITY.md documents those accepted,
# inherent findings; keep the two in sync.
#
# Needs the SNYK_TOKEN repository secret. Fork PRs don't receive secrets, so the scan
# is skipped there with a notice instead of failing. The raw JSON is uploaded as a
# workflow artifact for inspection either way.

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/html-skills/skills/**'
      - 'scripts/snyk-gate.py'
      - '.github/workflows/snyk-agent-scan.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/html-skills/skills/**'
  schedule:
    # Weekly: the scanner's judges evolve, so a skill can start failing with no change here.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for SNYK_TOKEN
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning::SNYK_TOKEN is not available (fork PR, or the secret is unset) — skipping the scan."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.token.outputs.present == 'true'

      - name: Run Snyk Agent Scan
        if: steps.token.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          uvx snyk-agent-scan@latest --skills plugins/html-skills/skills --json \
            > snyk-scan.json 2> snyk-scan.stderr.log \
            || echo "scanner exited non-zero (findings or an error) — gating on the JSON output"
          cat snyk-scan.stderr.log

      - name: Upload raw scan output
        if: steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-agent-scan
          path: |
            snyk-scan.json
            snyk-scan.stderr.log
          retention-days: 30

      - name: Gate on the accepted findings
        if: steps.token.outputs.present == 'true'
        run: python3 scripts/snyk-gate.py snyk-scan.json
